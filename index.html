<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React: куда пропали фотографии?</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <p class="p-4">
        Загрузка React… Если страница не открывается, проверьте доступ к CDN.
      </p>
    </div>
    <script
      crossorigin
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Data URLs let this demo run directly from index.html without a server.
      function readPhoto(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () =>
            resolve({
              id: crypto.randomUUID(),
              name: file.name,
              url: reader.result,
            });
          reader.onerror = () =>
            reject(new Error("Не удалось прочитать файл " + file.name));
          reader.readAsDataURL(file);
        });
      }

      // Deterministic latency makes both examples finish in the same order.
      // No request is sent: this is the uploadPhoto simulation from the article.
      async function uploadPhoto(photo, index) {
        await new Promise((resolve) =>
          setTimeout(resolve, 1000 + index * 1400),
        );
        return photo;
      }

      function Example({ fixed, files, run, onFinished }) {
        const [photos, setPhotos] = useState([]);
        const [completed, setCompleted] = useState([]);
        const [busy, setBusy] = useState(false);
        const started = useRef(0);

        async function handleFiles() {
          setBusy(true);
          try {
            await Promise.all(
              files.map(async (file, index) => {
                const uploadedPhoto = await uploadPhoto(file, index);
                if (fixed) {
                  setPhotos((prev) => [...prev, uploadedPhoto]);
                } else {
                  // Intentional bug: every callback reads the same render snapshot.
                  setPhotos([...photos, uploadedPhoto]);
                }
                setCompleted((prev) => [...prev, uploadedPhoto.id]);
              }),
            );
          } finally {
            setBusy(false);
            onFinished();
          }
        }

        useEffect(() => {
          if (run && started.current !== run) {
            started.current = run;
            handleFiles();
          }
        }, [run]);

        return (
          <section className="col-lg-6">
            <div
              className={
                "card h-100 demo-card " + (fixed ? "correct" : "broken")
              }
            >
              <div className="card-header bg-white py-3">
                <span
                  className={
                    "badge mb-2 " +
                    (fixed ? "text-bg-success" : "text-bg-danger")
                  }
                >
                  {fixed ? "Исправлено" : "С багом"}
                </span>
                <h2 className="h5 mb-1">
                  {fixed
                    ? "Добавляем к текущему списку"
                    : "Добавляем к старому снимку"}
                </h2>
                <p className="text-secondary small mb-0">
                  {fixed
                    ? "Каждое обновление учитывает предыдущие."
                    : "Каждый ответ заменяет результаты соседних загрузок."}
                </p>
              </div>
              <div className="card-body">
                <pre>
                  <code>
                    {fixed
                      ? "setPhotos(prev => [...prev, uploadedPhoto]);"
                      : "setPhotos([...photos, uploadedPhoto]);"}
                  </code>
                </pre>
                <div className="d-flex justify-content-between align-items-baseline my-3">
                  <span>Фотографий в галерее</span>
                  <strong className="display-5 fw-bold">{photos.length}</strong>
                </div>
                <div className="gallery" aria-live="polite">
                  {photos.length === 0 && (
                    <div className="empty">Пока пусто</div>
                  )}
                  {photos.map((photo) => (
                    <figure key={photo.id} className="mb-0">
                      <img src={photo.url} alt={photo.name} />
                      <figcaption title={photo.name}>{photo.name}</figcaption>
                    </figure>
                  ))}
                </div>
                <div
                  className="progress mt-4"
                  role="progressbar"
                  aria-label="Завершённые операции"
                  aria-valuenow={completed.length}
                  aria-valuemin="0"
                  aria-valuemax={files.length || 1}
                >
                  <div
                    className="progress-bar"
                    style={{
                      width: `${files.length ? (completed.length / files.length) * 100 : 0}%`,
                    }}
                  />
                </div>
                <p className="small text-secondary mt-2">
                  {busy
                    ? "Обработка файлов…"
                    : completed.length
                      ? "Обработка завершена"
                      : "Ожидание запуска"}{" "}
                  · {completed.length} / {files.length}
                </p>
                <ul className="list-group list-group-flush">
                  {files.map((file) => (
                    <li
                      key={file.id}
                      className="list-group-item px-0 d-flex justify-content-between gap-2"
                    >
                      <span className="filename">{file.name}</span>
                      <span
                        className={
                          "small flex-shrink-0 " +
                          (completed.includes(file.id)
                            ? "text-success"
                            : "text-secondary")
                        }
                      >
                        {completed.includes(file.id)
                          ? "Готово"
                          : busy
                            ? "Ожидание"
                            : "В очереди"}
                      </span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </section>
        );
      }

      function makeSamples() {
        return ["Горы", "Море", "Закат"].map((name, index) => {
          const canvas = document.createElement("canvas");
          canvas.width = 600;
          canvas.height = 400;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = ["#b9d9ec", "#a8e5df", "#f6cfab"][index];
          ctx.fillRect(0, 0, 600, 400);
          ctx.fillStyle = "#fff3ba";
          ctx.beginPath();
          ctx.arc(450, 100, 42, 0, 2 * Math.PI);
          ctx.fill();
          ctx.fillStyle = ["#537681", "#258d9a", "#a77489"][index];
          ctx.beginPath();
          ctx.moveTo(0, 400);
          ctx.lineTo(0, 290);
          ctx.lineTo(170, 120 + index * 50);
          ctx.lineTo(360, 300);
          ctx.lineTo(500, 200);
          ctx.lineTo(600, 270);
          ctx.lineTo(600, 400);
          ctx.fill();
          return {
            id: "sample-" + index,
            name: name + ".png",
            url: canvas.toDataURL(),
          };
        });
      }

      function App() {
        const [files, setFiles] = useState(makeSamples);
        const [run, setRun] = useState(0);
        const [version, setVersion] = useState(0);
        const [active, setActive] = useState(0);
        const [reading, setReading] = useState(false);
        const [error, setError] = useState("");
        function reset() {
          setRun(0);
          setVersion((v) => v + 1);
        }
        async function chooseFiles(event) {
          const selected = Array.from(event.target.files);
          event.target.value = "";
          if (!selected.length) return;
          if (
            selected.length > 6 ||
            selected.some(
              (f) => !f.type.startsWith("image/") || f.size > 10 * 1024 * 1024,
            )
          ) {
            setError("Выберите до 6 изображений, каждое не больше 10 МБ.");
            return;
          }
          setReading(true);
          setError("");
          try {
            const result = await Promise.all(selected.map(readPhoto));
            reset();
            setFiles(result);
          } catch (e) {
            setError(e.message);
          } finally {
            setReading(false);
          }
        }
        const disabled = active > 0 || reading;
        return (
          <>
            <nav className="navbar bg-white border-bottom">
              <div className="container">
                <span className="navbar-brand fw-semibold">
                  React / State lab
                </span>
                <span className="badge text-bg-light">Локальное демо</span>
              </div>
            </nav>
            <main className="container py-5">
              <h1 className="fw-bold">Три файла. Одна фотография?</h1>
              <p className="text-secondary mb-4">
                Одинаковые файлы, одинаковые задержки. Разница — одна строка
                обновления состояния.
              </p>
              <div className="toolbar d-flex flex-wrap gap-3 align-items-center mb-4">
                <button
                  className="btn btn-primary"
                  disabled={disabled}
                  onClick={() => {
                    setVersion((v) => v + 1);
                    setRun((r) => r + 1);
                    setActive(2);
                  }}
                >
                  {" "}
                  {active ? "Обработка…" : "Запустить сравнение"}
                </button>
                <label className="file-label">
                  Свои фотографии
                  <input
                    className="form-control form-control-sm mt-1"
                    type="file"
                    accept="image/*"
                    multiple
                    disabled={disabled}
                    onChange={chooseFiles}
                  />
                </label>
                <button
                  className="btn btn-outline-secondary btn-sm"
                  disabled={disabled}
                  onClick={() => {
                    reset();
                    setFiles(makeSamples());
                    setError("");
                  }}
                >
                  Тестовые картинки
                </button>
                <button
                  className="btn btn-outline-secondary btn-sm"
                  disabled={disabled}
                  onClick={reset}
                >
                  Сбросить
                </button>
              </div>
              <p className="small text-secondary">
                Файлы не отправляются на сервер. Задержка имитирует загрузку;
                первые три результата приходят через 1, 2,4 и 3,8 секунды.
              </p>
              {error && (
                <div className="alert alert-danger" role="alert">
                  {error}
                </div>
              )}
              <div className="row g-4" key={version}>
                <Example
                  fixed={false}
                  files={files}
                  run={run}
                  onFinished={() => setActive((n) => n - 1)}
                />
                <Example
                  fixed={true}
                  files={files}
                  run={run}
                  onFinished={() => setActive((n) => n - 1)}
                />
              </div>
              <div className="alert alert-light border mt-4 mb-0">
                <strong>Что происходит?</strong> Слева все ответы используют
                один снимок пустого массива. Справа функция обновления получает
                результат предыдущего обновления. Порядок картинок — порядок
                завершения операций.
              </div>
            </main>
          </>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
